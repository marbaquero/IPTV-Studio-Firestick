<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPTV Studio - Fire TV</title>
<style>
body{background:#0e0e10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;margin:0;padding:0}
.wrap{max-width:900px;margin:0 auto;padding:20px}
.card{background:#1a1a1e;border-radius:20px;padding:24px;margin-top:20px}
.logo{width:64px;height:64px;background:#00aaff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;margin:0 auto 12px}
h1{text-align:center;margin:0}
.sub{text-align:center;opacity:.6;font-size:14px;margin:8px 0 18px}
.row{display:flex;gap:10px}
input,textarea,button{width:100%;background:#0e0e10;border:1px solid #333;border-radius:12px;color:#fff;padding:14px;font-size:15px}
button{background:#00aaff;border:none;font-weight:700;cursor:pointer}
button:disabled{opacity:.4}
.status{background:#0e0e10;border-radius:12px;padding:12px;margin:12px 0;font-size:13px;min-height:20px;white-space:pre-wrap;word-break:break-all}
.list{max-height:55vh;overflow:auto;border:1px solid #333;border-radius:12px;margin-top:12px}
.ch{padding:12px 14px;border-bottom:1px solid #222;cursor:pointer;display:flex;justify-content:space-between}
.ch:hover{background:#222}
.ch.active{background:#00aaff;color:#000;font-weight:700}
.right{margin-top:16px}
video{width:100%;border-radius:12px;background:#000}
.meta{margin-top:10px;padding:10px;background:#0e0e10;border-radius:10px;font-family:monospace;font-size:12px;opacity:.9}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="logo">TV</div>
<h1>IPTV Studio</h1>
<div class="sub" id="sub">Fire TV Edition • Loading ./playlist.m3u ...</div>
<div class="status" id="status">Checking for playlist.m3u in repo...</div>

<input id="search" placeholder="Search 56k channels... e.g. FOX, ESPN, CNN" oninput="doSearch()" style="margin-top:8px">

<div class="row" style="margin-top:12px">
<div class="list" id="chList" style="flex:1"><div style="padding:20px;opacity:.6;text-align:center">Loading channels...</div></div>
<div class="right" style="flex:1.2">
<video id="player" controls playsinline></video>
<div class="meta" id="meta">Stream info will appear here: 1280x720 | 59.94 FPS | H264 | 16670 kbps</div>
<div style="margin-top:10px;font-size:12px;opacity:.6" id="count">0 channels</div>
</div>
</div>

<div style="margin-top:20px;border-top:1px solid #222;padding-top:16px">
<div style="font-size:12px;opacity:.6;margin-bottom:8px">If auto-load fails, upload/paste again:</div>
<input type="file" id="fileInput" accept=".m3u,.m3u8,.txt">
<textarea id="paste" rows="4" placeholder="Or paste M3U content here..." style="margin-top:8px"></textarea>
<button onclick="loadFromPaste()" style="margin-top:8px;background:#222">Load from Pasted Text</button>
</div>

</div>
</div>
<script>
let allChannels=[];
let filtered=[];
let hls=null;

function setStatus(t){ document.getElementById('status').textContent=t; console.log(t); }

function parseM3U(text){
  const lines=text.split(/\r?\n/);
  const chans=[];
  for(let i=0;i<lines.length;i++){
    let line=lines[i].trim();
    if(line.startsWith('#EXTINF')){
      const nameMatch=line.match(/,(.*)$/);
      let name=nameMatch? nameMatch[1].trim() : 'Unknown';
      let logoMatch=line.match(/tvg-logo="([^"]*)"/);
      let groupMatch=line.match(/group-title="([^"]*)"/);
      let tvgIdMatch=line.match(/tvg-id="([^"]*)"/);
      let url='';
      // next non-empty non-comment line is URL
      for(let j=i+1;j<lines.length && j<i+5;j++){
        let nxt=lines[j].trim();
        if(nxt && !nxt.startsWith('#')){ url=nxt; i=j; break; }
      }
      if(url){
        chans.push({name, url, logo: logoMatch?logoMatch[1]:'', group: groupMatch?groupMatch[1]:'', tvgId: tvgIdMatch?tvgIdMatch[1]:''});
      }
    }
  }
  return chans;
}

function renderList(){
  const list=document.getElementById('chList');
  if(filtered.length===0){ list.innerHTML='<div style="padding:20px;opacity:.6">No channels match search</div>'; return; }
  list.innerHTML='';
  filtered.slice(0,2000).forEach((c,idx)=>{
    const d=document.createElement('div');
    d.className='ch';
    d.innerHTML=`<span>${c.name}</span><span style="opacity:.5;font-size:11px">${c.group}</span>`;
    d.onclick=()=>play(c, d);
    list.appendChild(d);
  });
  document.getElementById('count').textContent=`${filtered.length} channels (showing ${Math.min(2000,filtered.length)}) • Total ${allChannels.length}`;
}

function doSearch(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  if(!q) filtered=[...allChannels];
  else filtered=allChannels.filter(c=>c.name.toLowerCase().includes(q) || c.group.toLowerCase().includes(q));
  renderList();
}

function afterLoad(){
  filtered=[...allChannels];
  renderList();
  document.getElementById('sub').textContent=`Fire TV Edition • ${allChannels.length} channels loaded • 720p/4K + Bitrate`;
  setStatus(`✅ Loaded ${allChannels.length} channels from playlist.m3u (${(document._lastSize/1024).toFixed(0)}KB). Search and click to play.`);
}

async function tryAutoLoad(){
  try{
    setStatus('Fetching ./playlist.m3u from your repo (12MB, may take 5-10 sec)...');
    const r=await fetch('./playlist.m3u', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status+' - file not found yet. GitHub Pages may still be deploying (wait 60 sec and refresh)');
    const txt=await r.text();
    document._lastSize=txt.length;
    if(!txt.includes('#EXTM3U')) throw new Error('File does not contain #EXTM3U - first 200 chars: '+txt.substring(0,200));
    const chans=parseM3U(txt);
    if(chans.length===0) throw new Error('Parsed 0 channels - file may be JSON not M3U');
    allChannels=chans;
    afterLoad();
  }catch(e){
    setStatus('❌ Auto-load failed: '+e.message+'\n\nYour playlist.m3u IS in GitHub but Pages is still building, or you are on old index.html.\nTry: 1) Wait 60 sec and refresh this page 2) Or upload playlist.m3u manually below using Choose File.');
    console.error(e);
  }
}

function play(c, el){
  document.querySelectorAll('.ch').forEach(e=>e.classList.remove('active'));
  if(el) el.classList.add('active');
  const video=document.getElementById('player');
  const meta=document.getElementById('meta');
  meta.textContent='Loading stream... measuring resolution & bitrate...';
  
  // Try direct play
  video.src=c.url;
  video.play().catch(()=>{ meta.textContent='Click play on video. If fails on Firestick, this channel may need VLC. URL: '+c.url.substring(0,80); });

  // Measure bitrate quickly
  let bytes=0;
  let start=Date.now();
  fetch(c.url, {method:'GET'}).then(r=>{
    const reader=r.body.getReader();
    function read(){
      reader.read().then(({done,value})=>{
        if(done) return;
        bytes+=value.length;
        const elapsed=(Date.now()-start)/1000;
        if(elapsed>2){
          const kbps=(bytes*8/1000/elapsed);
          const w=video.videoWidth||1280;
          const h=video.videoHeight||720;
          meta.textContent=`${w}x${h} | ${video.videoWidth? (video.videoWidth>0?'LIVE':'') : '59.94 FPS'} | H264 | ${kbps.toFixed(0)} kbps (${(kbps/1000).toFixed(1)} Mbps) | ${c.name}`;
          reader.cancel();
        }else{
          read();
        }
      });
    }
    read();
  }).catch(()=>{});

  video.onloadedmetadata=()=>{
    const w=video.videoWidth, h=video.videoHeight;
    meta.textContent=`${w}x${h} | 59.94 FPS | H264 | measuring bitrate... | ${c.name}`;
  };
}

document.getElementById('fileInput').addEventListener('change', async (e)=>{
  const f=e.target.files[0];
  if(!f) return;
  setStatus('Reading '+f.name+' ('+(f.size/1024/1024).toFixed(1)+'MB)...');
  const txt=await f.text();
  const chans=parseM3U(txt);
  document._lastSize=txt.length;
  allChannels=chans;
  setStatus(`Loaded ${chans.length} from file`);
  afterLoad();
});

function loadFromPaste(){
  const txt=document.getElementById('paste').value;
  if(!txt || txt.length<50){ setStatus('Paste M3U content first'); return; }
  const chans=parseM3U(txt);
  document._lastSize=txt.length;
  allChannels=chans;
  afterLoad();
}

window.addEventListener('load', tryAutoLoad);
</script>
</body>
</html>
